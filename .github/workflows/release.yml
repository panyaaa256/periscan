# Publishes one GitHub Release per mod version with the jars of every supported
# Minecraft version, then uploads each jar to Modrinth as its own version and
# updates the Modrinth project page. Push the tag v<version> on main to run it
# (see docs/releasing.md); every branch below must already have that
# mod.version.

name: release
on:
  push:
    tags:
      - 'v*'
      # The per-branch tags this workflow creates must not start it again.
      - '!v*\+*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          # main is built at the pushed tag, the other branches at their head.
          - branch: main
            range: 1.21.9-26.3
          - branch: mc/1.21.5-1.21.8
            range: 1.21.5-1.21.8
          - branch: mc/1.20.5-1.21.4
            range: 1.20.5-1.21.4
          - branch: mc/1.20-1.20.4
            range: 1.20-1.20.4
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch == 'main' && github.ref || matrix.branch }}
      - name: check the mod version
        run: |
          version=$(sed -n 's/^mod\.version = "\(.*\)"$/\1/p' stonecutter.properties.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::${{ matrix.branch }} has mod.version $version, but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          # Remember the built commit for the per-branch tag.
          mkdir -p release
          git rev-parse HEAD > "release/${{ matrix.range }}.sha"
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      # Restores the Gradle User Home cache (read only for tag builds).
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # Builds and tests every Minecraft version of the branch, then copies the
      # jars to build/libs/<mod version>/.
      - name: build
        run: ./gradlew build buildAndCollect
      # The mod jars only; the -sources jars are not attached to the release.
      - name: collect jars
        run: find build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} release/ \;
      - name: upload jars
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.range }}
          path: release/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: download jars
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release/
          merge-multiple: true
      # Records which commit each branch's jars were built from.
      - name: tag the built commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for sha_file in release/*.sha; do
            range=$(basename "$sha_file" .sha)
            git fetch --no-tags origin "$(cat "$sha_file")"
            git tag "$GITHUB_REF_NAME+$range" "$(cat "$sha_file")"
            git push origin "$GITHUB_REF_NAME+$range"
          done
      - name: create the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: release/*.jar
          fail_on_unmatched_files: true

  # One Modrinth version per jar, uploaded from the GitHub Release in the order
  # of the Minecraft versions (see modrinth-upload.yml). Skipped until the
  # repository variable MODRINTH_PROJECT_ID is set (see docs/releasing.md).
  modrinth:
    needs: publish
    if: vars.MODRINTH_PROJECT_ID != ''
    uses: ./.github/workflows/modrinth-upload.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  # Brings the Modrinth project page in line with the released commit: the
  # summary, links and the description (docs/modrinth.md). The icon and the
  # gallery are only uploaded by the modrinth page workflow.
  modrinth-page:
    needs: publish
    if: vars.MODRINTH_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: update the project page
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: python3 .github/scripts/modrinth_sync.py
