# Publishes one GitHub Release per mod version with the jars of every supported
# Minecraft version, then uploads each jar to Modrinth as its own version,
# updates the Modrinth project page and posts the changelog to Discord. Push
# the tag v<version> on main to run it (see docs/releasing.md); every branch
# below must already have that mod.version.

name: release
on:
  push:
    tags:
      - 'v*'
      # The per-branch tags this workflow creates must not start it again.
      - '!v*\+*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          # main is built at the pushed tag, the other branches at their head.
          - branch: main
            range: 1.21.9-26.3
          - branch: mc/1.21.5-1.21.8
            range: 1.21.5-1.21.8
          - branch: mc/1.20.5-1.21.4
            range: 1.20.5-1.21.4
          - branch: mc/1.20-1.20.4
            range: 1.20-1.20.4
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch == 'main' && github.ref || matrix.branch }}
      - name: check the mod version
        run: |
          version=$(sed -n 's/^mod\.version = "\(.*\)"$/\1/p' stonecutter.properties.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::${{ matrix.branch }} has mod.version $version, but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          # Remember the built commit for the per-branch tag.
          mkdir -p release
          git rev-parse HEAD > "release/${{ matrix.range }}.sha"
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      # Restores the Gradle User Home cache (read only for tag builds).
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # Builds and tests every Minecraft version of the branch, then copies the
      # jars to build/libs/<mod version>/.
      - name: build
        run: ./gradlew build buildAndCollect
      # The mod jars only; the -sources jars are not attached to the release.
      - name: collect jars
        run: find build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} release/ \;
      - name: upload jars
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.range }}
          path: release/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      jars: ${{ steps.jars.outputs.jars }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: download jars
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release/
          merge-multiple: true
      # Records which commit each branch's jars were built from.
      - name: tag the built commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for sha_file in release/*.sha; do
            range=$(basename "$sha_file" .sha)
            git fetch --no-tags origin "$(cat "$sha_file")"
            git tag "$GITHUB_REF_NAME+$range" "$(cat "$sha_file")"
            git push origin "$GITHUB_REF_NAME+$range"
          done
      - name: create the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: release/*.jar
          fail_on_unmatched_files: true
      # The jar names for the modrinth job, as a JSON array sorted by Minecraft
      # version (1.21.8 before 1.21.10).
      - name: list the jars
        id: jars
        run: echo "jars=$(cd release && ls *.jar | sort -V | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  # One Modrinth version per jar, each with the Minecraft versions of its
  # fabric.mod.json. The jars go up one at a time, oldest Minecraft version
  # first: Modrinth lists versions by upload time, so the newest Minecraft
  # version ends up on top. Skipped until the repository variable
  # MODRINTH_PROJECT_ID is set (see docs/releasing.md).
  modrinth:
    needs: publish
    if: vars.MODRINTH_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    strategy:
      # In the order of the list. A failed upload stops the rest, so that
      # "Re-run failed jobs" continues in the same order.
      max-parallel: 1
      fail-fast: true
      matrix:
        jar: ${{ fromJSON(needs.publish.outputs.jars) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: download jars
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release/
          merge-multiple: true
      # periscan-1.0.0+26.2.jar -> 1.0.0+26.2. Without it mc-publish would use
      # the tag, giving every jar the same version number.
      - name: read the version
        id: version
        run: |
          version="${{ matrix.jar }}"
          version="${version#periscan-}"
          echo "version=${version%.jar}" >> "$GITHUB_OUTPUT"
      # The Minecraft versions, loader and environment are read from the
      # jar's fabric.mod.json. The dependencies are listed here because YACL's
      # mod id (yet_another_config_lib_v3) is not its Modrinth slug (yacl).
      - name: upload to modrinth
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release/${{ matrix.jar }}
          name: PeriScan ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: release
          changelog-file: CHANGELOG.md
          game-version-filter: releases
          # Modrinth sometimes answers 502 for a few minutes.
          retry-attempts: 5
          retry-delay: 30000
          modrinth-dependencies: |
            fabric-api(required)
            yet_another_config_lib_v3(required){modrinth:yacl}
            litematica(optional)
            modmenu(optional)

  # Brings the Modrinth project page in line with the released commit: the
  # summary, links and the description (docs/modrinth.md). The icon and the
  # gallery are changed on Modrinth itself.
  modrinth-page:
    needs: publish
    if: vars.MODRINTH_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: update the project page
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: python3 .github/scripts/modrinth_sync.py

  # Posts CHANGELOG.md to Discord once every jar is on Modrinth, followed by a
  # link to the Modrinth page. Needs the secret DISCORD_WEBHOOK_URL (see
  # docs/releasing.md).
  discord:
    needs: modrinth
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      # The changelog, a blank line, then the Modrinth link. The link goes in
      # the embed's description because that is the only place below the
      # changelog where Discord renders a link.
      - name: read the changelog
        id: changelog
        env:
          MODRINTH_URL: https://modrinth.com/mod/${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          {
            echo 'body<<CHANGELOG_EOF'
            cat CHANGELOG.md
            printf '\n\n[Download on Modrinth](%s)\n' "$MODRINTH_URL"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"
      # The embed's title links to the GitHub Release. There is no release
      # event on a tag push, so the release is passed in through the inputs.
      - name: post to discord
        uses: SethCohen/github-releases-to-discord@v1.20.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          release_name: PeriScan ${{ github.ref_name }}
          release_body: ${{ steps.changelog.outputs.body }}
          release_html_url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          footer_title: ぱんや
          footer_icon_url: https://raw.githubusercontent.com/${{ github.repository }}/main/docs/assets/discord_footer_icon.png
