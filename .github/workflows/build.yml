# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      # Caches Gradle User Home: dependencies, and the Minecraft jars Loom
      # downloads and remaps. By default only main writes the cache; mc/*
      # branches write theirs too, as they build other Minecraft versions.
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref_name != 'main' && !startsWith(github.ref_name, 'mc/') }}
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # Builds and tests every Minecraft version, then copies all jars to build/libs/<mod version>/.
      - name: build
        run: ./gradlew build buildAndCollect
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
