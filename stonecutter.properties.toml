# Build parameters shared by every Minecraft version, plus per-version overrides.
# https://stonecutter.kikugie.dev/wiki/v2/reference/gradle-api/structured-properties
# Mod dependency versions are not listed here: Fletching Table looks up the
# latest release for each Minecraft version on Modrinth (see build.gradle.kts).
# Fabric API is the exception (deps.fabric_api), as it must come from Fabric's maven.
mod.id = "periscan"
mod.version = "0.5.0"
mod.group = "com.panyaaa256"
# YACL range written into fabric.mod.json
mod.yacl_compat = ">=3.8.2"

deps.fabric_loader = "0.19.3"
# Loom version used by loom-back-compat for both Loom variants
loomx.loom_version = "1.17.19"
deps.junit = "6.1.3"

["1.19.4"]
# Minecraft range written into fabric.mod.json
mod.mc_compat = "1.19.4"
mod.yacl_compat = ">=3.1.1"
deps.fabric_api = "0.87.2+1.19.4"

["1.20.1"]
mod.mc_compat = ">=1.20 <=1.20.1"
mod.yacl_compat = ">=3.6.6"
deps.fabric_api = "0.92.12+1.20.1"

["1.20.4"]
mod.mc_compat = ">=1.20.3 <=1.20.4"
mod.yacl_compat = ">=3.6.6"
deps.fabric_api = "0.97.3+1.20.4"
